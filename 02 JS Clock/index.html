<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .clock {
            position: relative;
            border: 15px solid #e2e8f0;
            box-shadow: 0 0 0 4px rgba(0,0,0,0.1),
                        inset 0 0 0 3px #4a5568,
                        inset 0 0 10px black,
                        0 0 10px rgba(0,0,0,0.2);
        }
        
        .clock-face {
            position: relative;
            width: 100%;
            height: 100%;
            transform: translateY(-4px); /* account for the height of the clock hands */
        }
        
        .hand {
            position: absolute;
            top: 50%;
            width: 50%;
            height: 6px;
            background: black;
            border-radius: 6px;
            transform-origin: 100%;
            transform: rotate(90deg);
            transition: all 0.05s;
            transition-timing-function: cubic-bezier(0.1, 2.7, 0.58, 1);
        }
        
        .hour-hand {
            width: 35%;
            right: 50%;
            height: 8px;
            background-color: #2d3748;
        }
        
        .min-hand {
            width: 45%;
            right: 50%;
            height: 6px;
            background-color: #4a5568;
        }
        
        .second-hand {
            width: 48%;
            right: 50%;
            height: 3px;
            background-color: #e53e3e;
        }

        /* Center dot */
        .clock::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            background: #2d3748;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="w-full h-screen bg-zinc-700 flex items-center justify-center">
        <div class="clock w-72 h-72 rounded-[50%] bg-slate-100">
            <div class="clock-face ">
                <div class="hand second-hand"></div>
                <div class="hand min-hand"></div>
                <div class="hand hour-hand"></div>
            </div>
        </div>
    </div>
    <script src="./script.js">
    </script>
</body>
</html>
